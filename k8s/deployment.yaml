apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp145-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mp145-api
  template:
    metadata:
      labels:
        app: mp145-api
    spec:
      containers:
        - name: mp145-api
          image: mp145-api:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
